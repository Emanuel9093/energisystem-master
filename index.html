<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ES Masterplanering</title>
  <meta name="description" content="Planera kurserna på civilingenjörsprogrammen i energisystem och industriell ekonomi år för år, kontrollera examenskraven och se vilka kurser dina programkamrater läser.">
  <link rel="icon" href="assets/es-icon.png" id="favicon">
  <script>try { document.documentElement.dataset.program = localStorage.getItem("es-program") || "ES"; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./">
        <img src="assets/es-icon.png" alt="" width="40" height="40" id="brand-icon">
        <div>
          <strong id="brand-name">Energisystem</strong>
          <span>Masterplanering</span>
        </div>
      </a>
      <nav class="tabs" id="tabs" hidden>
        <button data-view="plan" class="active">Min plan</button>
        <button data-view="classmates" id="tab-people">ESare</button>
        <button data-view="pool">Kurspoolen</button>
        <button data-view="grades">Mina betyg</button>
        <button data-view="guide">Guide</button>
        <button data-view="admin" id="tab-admin" hidden>Förfrågningar</button>
      </nav>
      <div class="user" id="user"></div>
    </div>
  </header>

  <div id="demo-banner" class="banner" hidden>
    <div class="wrap">Demoläge: inget sparas på servern och de andra studenterna är påhittade. Se README för hur sidan kopplas till Supabase.</div>
  </div>

  <main class="wrap" id="app">
    <p class="muted">Laddar…</p>
  </main>

  <dialog id="dlg" aria-label="Kurs"></dialog>

  <footer class="wrap footer muted" id="footer">
    Sidan är ett hjälpmedel. Det är Examensenheten som avgör om du får ut din examen.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
